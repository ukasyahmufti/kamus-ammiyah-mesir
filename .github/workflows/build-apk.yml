name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Web Directory
        run: |
          mkdir www
          cp index.html www/
          cp kamus.json www/
          cp manifest.json www/
          cp sw.js www/
          cp icon.png www/

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@5 @capacitor/core@5

      - name: Initialize Node project and install dependencies
        run: |
          npm init -y
          npm install @capacitor/android@5 @capacitor/core@5

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Files
        run: npx cap sync android

      - name: Clean Gradle Cache
        run: rm -rf ~/.gradle/caches

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
